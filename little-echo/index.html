</style></head><body><header><a class="brand" href="#" aria-label="小小回声首页"><span class="brand-icon">◒</span><span>小小回声<small>LITTLE ECHO</small></span></a><button class="quiet" id="about">这是什么测试？</button></header><main id="app"></main><footer><span>每个孩子，都有自己的生长节奏。</span><span>亲子小测试 · 分段体验版</span></footer><dialog id="info"><button class="close" aria-label="关闭说明">×</button><div class="eyebrow">A LITTLE NOTE</div><h2>理解，比定义更重要。</h2><p>这是为 3–6 岁孩子的照顾者设计的轻松互动探索，不是经过验证的心理量表，不作诊断、人格定型或未来预测。</p><p>结果来自你对最近两周的回忆，孩子部分是你的观察视角。环境、疲惫程度和不同照顾者，都可能影响表现。</p><p>答题和练习记录仅存于此浏览器的当前会话中，不通过本应用提交至服务器；关闭标签页后会话数据通常会清除。页面托管服务仍可能处理普通访问日志。</p><p>无需填写孩子姓名、照片或生日。你可以随时清除本次记录。</p><button class="primary close-info">我了解了</button></dialog><script>
/* Original reflection prompts; not a validated personality scale. */
const KIDS=[
{name:'探索小火花',short:'小火花',tag:'好奇先行 · 边试边懂',color:'#e9ba6b',light:'#fcf0d6',icon:'spark',lead:'“让我试试！”是 TA 靠近世界的方式。',body:'你更常选到主动尝试、马上行动的表现。孩子可能喜欢先参与，再慢慢弄明白规则。',need:'先有一个可以行动的小入口，再听简短、具体的提醒。',strength:'新鲜事物很容易点亮 TA 的兴趣。'},
{name:'慢热小蜗牛',short:'小蜗牛',tag:'先观察 · 熟悉了再靠近',color:'#abb7ce',light:'#eef0f8',icon:'snail',lead:'TA 不是不想走，只是想先看清前面的路。',body:'你更常选到先观察、需要准备的表现。熟悉的人、环境和清楚的下一步，可能让孩子更自在。',need:'给一点预告和观察时间，不急着催 TA 立刻加入。',strength:'TA 愿意仔细看，也可能留意到别人忽略的小细节。'},
{name:'感受小浪花',short:'小浪花',tag:'感受鲜明 · 很在意回应',color:'#96bcb7',light:'#e7f2ed',icon:'wave',lead:'小小的心里，常常有很大的感受。',body:'你更常选到情绪鲜明、需要回应的表现。被认真听见时，孩子可能更容易重新和你连接。',need:'先让感受被听见，再把要求说短一点、具体一点。',strength:'TA 的开心和难过都很鲜活，也在学习表达自己的需要。'},
{name:'坚定小树苗',short:'小树苗',tag:'主意明确 · 想自己来',color:'#a4b181',light:'#eef0df',icon:'tree',lead:'“我想自己来”，是 TA 小小的坚持。',body:'你更常选到坚持目标、希望自己决定的表现。比起被接手，孩子可能更想参与下一步的决定。',need:'在清楚的边界里，保留一个真正可以自己决定的部分。',strength:'认定的事情，TA 愿意投入和坚持。'}];
const PARENTS=[

function home(){root.innerHTML=`<section class="landing"><div class="hero-copy"><div class="pill">给 3–6 岁孩子的家长 · 轻松小测试</div><h1>你家娃，<br>是哪一种<br><em>小小性格？</em><span class="hand-star">✳</span></h1><p class="lead">是爱冒险的小火花，还是先观察的小蜗牛？<br>选 5 个日常小瞬间，先认识 TA 多一点。</p><div class="actions"><button class="primary" id="start">关注后，测测我家娃 <span>5 题</span></button></div><p class="small-note">关注引导 · 先看孩子结果，再自愿测自己。</p>${state.child.length?'<button class="text-link" id="resume">继续上一次的小探索</button>':''}</div><div class="hero-collage"><div class="orbit orbit-a"></div><div class="orbit orbit-b"></div><div class="sticker sticker-child">${mascot('snail','#acaece',150)}<span>慢一点，也没关系</span></div><div class="sticker sticker-flower">${mascot('flower','#e9b67e',200)}<span>每个小孩都有自己的光</span></div><div class="sticker sticker-heart">${mascot('heart','#d7a7b3',130)}</div><div class="handwriting">原来，我们只是节奏不同。</div><span class="tiny-star">✧</span></div></section><section class="journey"><div><span class="journey-icon">✿</span><strong>先认识孩子</strong><p>5 题，一张小小性格卡</p></div><div><span class="journey-icon">♡</span><strong>再看看自己</strong><p>愿意的话，再来 5 题</p></div><div><span class="journey-icon">⌁</span><strong>看看怎么合拍</strong><p>带走能用在生活里的话</p></div></section><p class="page-note">一个轻松的亲子观察游戏，不是心理诊断，也不给孩子定型。<br>比起“测得准不准”，更想陪你发现那些真实的小瞬间。</p>`;$('#start').onclick=startChild;if($('#resume'))$('#resume').onclick=()=>{if(state.child.length===5)go(state.parent.length===5?'combo':'childResult');else {state.part='child';state.index=Math.min(state.child.length,4);go('quiz')}};}
function age(){root.innerHTML=`<section class="compact"><button class="text-link" id="back">回到首页</button><div class="center">${mascot('tree','#a4b181',130)}<h1>先想一个孩子就好。</h1><p class="lead">如果你有两个娃，可以分别测。<br>不比较谁更好，只看看各自的小特点。</p></div><h2 class="small-heading">TA 现在几岁？</h2><div class="age-picks">${[3,4,5,6].map(a=>`<button data-age="${a}" class="age-pick ${state.age===a?'selected':''}" aria-pressed="${state.age===a}">${a}<small>岁</small></button>`).join('')}</div><p class="small-note center">不用填名字、照片或生日。想着最近两周作答。</p><button class="primary wide" id="begin" ${state.age?'':'disabled'}>好，开始 5 道小问题</button></section>`;$('#back').onclick=()=>go('home');document.querySelectorAll('[data-age]').forEach(b=>b.onclick=()=>{state.age=+b.dataset.age;render(false)});$('#begin').onclick=()=>{state.part='child';state.index=0;go('quiz')};}
function quiz(){const child=state.part==='child',list=child?CHILD_Q:PARENT_Q,q=list[state.index],a=state[state.part];root.innerHTML=`<section class="compact quiz"><div class="quiz-top"><span class="pill">${child?'✿ 认识孩子':'♡ 认识自己'}</span><span class="count">${state.index+1} <small>/ 5</small></span></div><div class="dots" aria-label="第 ${state.index+1} 题，共 5 题">${list.map((_,i)=>`<i class="${i<=state.index?'filled':''}"></i>`).join('')}</div><p class="quiz-hint">${child?'不用想“应该怎样”，选最像 TA 的。':'不用做满分家长，选更常发生的。'}</p><h1 class="question">${q.t}</h1><div class="options" role="group" aria-label="答案">${q.o.map((t,i)=>`<button class="option ${a[state.index]===i?'selected':''}" data-answer="${i}" aria-pressed="${a[state.index]===i}"><span class="option-letter">${String.fromCharCode(65+i)}</span><span>${t}</span><span class="selected-mark">✓</span></button>`).join('')}<button class="unsure ${a[state.index]===4?'selected':''}" data-answer="4" aria-pressed="${a[state.index]===4}">不太确定，或最近没遇到</button></div><div class="quiz-nav"><button class="text-link" id="prev">${state.index?'上一题':child?'回到年龄选择':'回看孩子结果'}</button><button class="primary" id="next" ${a[state.index]===undefined?'disabled':''}>${state.index===4?child?'看看 TA 的小性格':'看看我的相处风格':'选好了，下一题'}</button></div><div class="gentle-note">${state.index===4?'最后一题啦，你们的小画像就要出现了。':'不用每次都一样。选最近更常见的一种就好。'}</div></section>`;document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{a[state.index]=+b.dataset.answer;render(false)});$('#prev').onclick=()=>{if(state.index){state.index--;render()}else go(child?'age':'childResult')};$('#next').onclick=()=>{if(a[state.index]===undefined)return;if(state.index<4){state.index++;render()}else go(child?'childResult':'parentResult')};}
function evidence(kind,p){const list=kind==='child'?CHILD_Q:PARENT_Q,a=state[kind];const indexes=a.flatMap((v,i)=>p.primary!==null?v===p.primary?[i]:[]:v<4?[i]:[]).slice(0,2);return indexes.map(i=>`<li><span>${list[i].t}</span><strong>你选了：${list[i].o[a[i]]}</strong></li>`).join('')||'<li>明确回答还不多，暂时不做类型归类。</li>';}
function result(kind){const child=kind==='child',p=profile(state[kind]),types=child?KIDS:PARENTS,type=p.primary!==null?types[p.primary]:null,title=titleOf(p,kind);root.innerHTML=`<section class="result-wrap"><div class="result-topline"><span class="pill">${child?'孩子的小画像':'你的相处风格'}</span><span>根据 ${p.valid} 个明确回答</span></div><article class="personality-card" style="--tone:${type?.color||'#b3aec7'};--wash:${type?.light||'#f0ecf5'}"><div class="card-top"><span>LITTLE ECHO · ${child?'CHILD':'PARENT'}</span><span>✧</span></div>${mascot(type?.icon||'flower',type?.color||'#b3aec7',190)}<p class="result-overline">${child?'从你的观察看，TA 更像':'在这几道题里，你更像'}</p><h1>${title}</h1><div class="type-tag">${type?.tag||'不急着归类 · 允许有很多面'}</div><p class="result-quote">${type?.lead||(p.valid<3?'现在还不够了解，先留一点空间。':'有时候这样，有时候那样，也很真实。')}</p><p class="result-body">${type?.body||(p.valid<3?'有几题你选择了不确定。与其硬给一个标签，不如先观察几天，再来看看。':'你的选择没有集中在唯一一种风格。下面保留不同侧面，不强行把你们装进一个盒子。')}</p></article>${!type&&p.valid>=3?`<div class="mixed-grid">${p.leaders.map(i=>`<div class="soft-box"><strong>${types[i].name}</strong><p>${types[i].body}</p></div>`).join('')}</div>`:''}<div class="insight-grid"><div class="insight"><span class="mini-symbol">✧</span><h2>${child?'TA 身上可爱的一面':'你带给关系的力量'}</h2><p>${type?.strength||'你愿意停下来观察真实情况，已经给理解彼此留出了空间。'}</p></div><div class="insight"><span class="mini-symbol">♡</span><h2>${child?'相处时，可以多给一点':'给自己一个小提醒'}</h2><p>${type?.need||'先选一次具体互动，观察发生了什么，不急着概括成固定性格。'}</p></div></div><details class="evidence"><summary>为什么会出现这个结果？</summary><ul>${evidence(kind,p)}</ul><p>5 题只是一小段观察：至少 3 个明确回答，且某一类型唯一最多、出现至少 2 次，才展示单一画像；并列或观察不足如实保留。这不是标准化心理量表。</p></details><div class="next-chapter"><span class="chapter-kicker">${child?'故事还有另一半':'两张画像，终于可以放在一起了'}</span><h2>${child?'那你自己，是哪种家长？':'你和 TA，为什么有时合拍，<br>有时又会小小较劲？'}</h2><p>${child?'孩子的节奏看见了，也别忘了看看自己。<br>再选 5 个小瞬间，就能拼出你们的相处组合。':'接下来不再答题。看看你们的组合，<br>再挑一个真实场景，找一句今天能用的话。'}</p><button class="primary wide" id="continue">${child?state.parent.length===5?'回看我的结果':'我也想测测自己 · 再来 5 题':'看看我们的亲子组合'}</button><button class="text-link" id="save-card">保存这张结果卡</button><p id="download-status" class="status" role="status"></p></div><div class="foot-actions"><button class="text-link" id="edit">回看这 5 题</button><button class="text-link" id="home">${child?'先到这里，回首页':'回看孩子的结果'}</button></div><p class="page-note">${child?'这是你眼中的孩子，TA 在其他环境中可能有不同表现。':'这是日常回应倾向，不是好父母排行榜。'}<br>性格卡只是交流的起点，不是固定标签。</p></section>`;$('#continue').onclick=()=>{if(child){if(state.parent.length===5)go('parentResult');else startParent()}else go('combo')};$('#save-card').onclick=()=>downloadCard(title,type?.lead||'允许不同的侧面，慢慢认识彼此。',type?.color||'#b3aec7',child?'家长观察版 · 非心理诊断':'自我观察版 · 非心理诊断');$('#edit').onclick=()=>{state.part=kind;state.index=0;go('quiz')};$('#home').onclick=()=>go(child?'home':'childResult');}
function comboData(){const cp=profile(state.child),pp=profile(state.parent),certain=cp.primary!==null&&pp.primary!==null;const pair=certain?PAIRS[pp.primary][cp.primary]:['你们有很多面，不止一种合拍方式','回答里保留了不同侧面。你愿意了解彼此，可以成为下一次沟通的起点。','现有回答没有形成唯一组合，因此不推断固定的冲突模式。可以从一个具体场景开始观察。','不急着套类型，先记录事情怎么开始、你怎么回应、孩子接下来怎样。一次只调整一步。'];return{cp,pp,certain,pair};}
function scenarioHTML(cp,pp){const s=SCENES[state.scene]||SCENES[0];return `<div class="scenario-intro"><span class="scenario-icon">${s.icon}</span><h3>${s.opening}</h3></div><div class="try-quote"><small>下次，可以试着这样说</small><blockquote>${s.line}</blockquote></div><div class="scenario-steps"><div><span>先照顾 TA 的节奏</span><p>${cp.primary!==null?s.child[cp.primary]:'先确认当时的感受和需要，不预设是故意不配合。'}</p></div><div><span>再给自己一个提醒</span><p>${pp.primary!==null?s.parent[pp.primary]:'留意自己的语气和节奏，让下一步更具体。'}</p></div><div><span>平静后再聊一句</span><p>${s.after}</p></div></div>`;}
function combo(){if(state.child.length!==5||state.parent.length!==5){go(state.child.length===5?'childResult':'home');return}const {cp,pp,certain,pair}=comboData(),ct=cp.primary!==null?KIDS[cp.primary]:null,pt=pp.primary!==null?PARENTS[pp.primary]:null;root.innerHTML=`<section class="result-wrap combo"><div class="center"><div class="pill">你们的亲子组合 · 无需继续答题</div><h1>原来，我们是<br><em>这样的一对。</em></h1><p class="lead">不求天生合拍，一起慢慢靠近就好。</p></div><div class="pair-display"><div>${mascot(pt?.icon||'heart',pt?.color||'#c7adb8',130)}<strong>${titleOf(pp,'parent')}</strong><small>你的回应习惯</small></div><span class="pair-plus">♡</span><div>${mascot(ct?.icon||'flower',ct?.color||'#afbb94',130)}<strong>${titleOf(cp,'child')}</strong><small>你观察到的孩子</small></div></div><article class="pair-story"><span class="chapter-kicker">你们的相处关键词</span><h2>${pair[0]}</h2><div class="story-section"><h3>✧ 合拍的时候</h3><p>${pair[1]}</p></div><div class="story-section"><h3>⌁ 可能卡住的地方</h3><p>${pair[2]}</p></div><div class="story-section highlight"><h3>♡ 先试一个小调整</h3><p>${pair[3]}</p></div><p class="fineprint">${certain?'这是根据两张画像提出的相处假设，不代表你们一定如此。':'目前不作单一类型匹配。'}真实场景，比标签更重要。</p></article><section class="scene-panel"><span class="chapter-kicker">把理解放回生活里</span><h2>最近，哪件事最让你头疼？</h2><p class="muted">点一下就能切换，不用再做题。</p><div class="scene-tabs" role="group" aria-label="选择生活场景">${SCENES.map((s,i)=>`<button data-scene="${i}" class="${state.scene===i?'active':''}" aria-pressed="${state.scene===i}">${s.icon} ${s.name}</button>`).join('')}</div><div id="scenario">${scenarioHTML(cp,pp)}</div></section><section class="reflection"><h2>这段描述，像你们吗？</h2><div class="fit-options">${['挺像的','有时像，有时不像','不太像'].map(v=>`<button data-fit="${v}" class="${state.fit===v?'active':''}">${v}</button>`).join('')}</div><p class="status" id="fit-status" role="status">${state.fit==='不太像'?'那就先放下标签。真实的你们，比这份结果更重要。':''}</p><label for="note">留一句话，给下一次的自己</label><textarea id="note" placeholder="比如：明天出门前，先告诉 TA 接下来要做什么。">${esc(state.note)}</textarea><button class="text-link" id="save-note">记下来</button><p class="status" id="note-status" role="status"></p></section><div class="end-card">${mascot('heart','#d5a7b4',90)}<h2>你不用成为完美的家长。<br>愿意多理解一点，就很好。</h2><p>一次只试一个改变。看看是否更容易重新合作，<br>不只看孩子有没有马上听话。</p><button class="primary" id="save-pair">保存我们的组合卡</button><p class="status" id="download-status" role="status"></p></div><div class="foot-actions"><button class="text-link" id="back-parent">回看我的结果</button><button class="text-link" id="restart">换一个孩子，重新测</button><button class="text-link" id="clear">清除这次记录</button></div><details class="evidence"><summary>关于结果和隐私</summary><p>这是原创日常互动探索，不是经过验证的心理量表。每段 5 道题，明确回答少于 3 题时不归类；唯一最多的风格至少出现 2 次才形成单一画像，并列时显示混合侧面。组合按双方画像匹配，建议不是治疗或效果承诺。</p><p>答案和文字仅存于当前浏览器会话，不通过本应用上传；关闭标签页后会话数据通常清除。托管服务可能记录普通访问日志。下载或分享结果卡由你主动选择。</p></details><p class="page-note">不要用结果责备自己，也不要用结果定义孩子。<br>每段关系，都可以继续生长。</p></section>`;document.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>{state.scene=+b.dataset.scene;persist();document.querySelectorAll('[data-scene]').forEach(x=>{x.classList.toggle('active',x===b);x.setAttribute('aria-pressed',x===b?'true':'false')});$('#scenario').innerHTML=scenarioHTML(cp,pp)});document.querySelectorAll('[data-fit]').forEach(b=>b.onclick=()=>{state.fit=b.dataset.fit;persist();document.querySelectorAll('[data-fit]').forEach(x=>x.classList.toggle('active',x===b));$('#fit-status').textContent=state.fit==='不太像'?'那就先放下标签。真实的你们，比这份结果更重要。':'记下了。下一次真实互动，会让你更了解彼此。'});$('#save-note').onclick=()=>{state.note=$('#note').value;persist();$('#note-status').textContent='记下啦，仅保留在当前浏览器会话。'};$('#save-pair').onclick=()=>downloadCard(titleOf(pp,'parent')+' × '+titleOf(cp,'child'),pair[3],'#a3b28b','亲子相处探索 · 不作性格预测');$('#back-parent').onclick=()=>go('parentResult');$('#restart').onclick=()=>reset(true);$('#clear').onclick=()=>reset(false);}
function reset(start){if(window.confirm('重新开始会清除这次答案和记录，继续吗？')){try{sessionStorage.removeItem(KEY)}catch{}state=fresh();if(start)state.view='age';render();}}
function downloadCard(title,body,color,caption){const c=document.createElement('canvas');c.width=1080;c.height=1350;const x=c.getContext('2d');x.fillStyle='#faf7f1';x.fillRect(0,0,1080,1350);x.fillStyle=color;x.beginPath();x.arc(890,180,270,0,Math.PI*2);x.fill();x.fillStyle='#46563f';x.font='25px sans-serif';x.fillText('小小回声 / LITTLE ECHO',90,110);function wrap(t,y,size,width=900){x.font=`${size}px sans-serif`;let row='';for(const ch of t){if(x.measureText(row+ch).width>width){x.fillText(row,90,y);y+=size*1.6;row=ch}else row+=ch}if(row)x.fillText(row,90,y);return y+size*1.6;}x.fillStyle='#364437';let y=wrap(title,395,58);x.fillStyle='#697365';wrap(body,y+90,34);x.fillStyle='#46563f';wrap('不求天生合拍，一起慢慢靠近。',1060,32);x.fillStyle='#7b8074';wrap(caption,1210,24);showCard(c.toDataURL('image/png'));$('#download-status').textContent='结果卡预览已打开，可长按图片保存。';}
function render(scroll=true){if(state.view==='quiz'&&(!state.age||!['child','parent'].includes(state.part)))state.view='home';if(!state.followConfirmed&&!['home','follow'].includes(state.view)){state.pendingView=state.view;state.view='follow'}persist();if(state.view==='follow')followGate();else if(state.view==='age')age();else if(state.view==='quiz')quiz();else if(state.view==='childResult')result('child');else if(state.view==='parentResult')result('parent');else if(state.view==='combo')combo();else home();if(scroll)window.scrollTo(0,0);}
$('#about').onclick=()=>$('#info').showModal();$('.close').onclick=()=>$('#info').close();$('.close-info').onclick=()=>$('#info').close();$('.brand').onclick=e=>{e.preventDefault();go('home')};render();


</script></body></html>
